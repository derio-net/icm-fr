    body: RinDig/Interpretable-Context-Methodology (_core/CONVENTIONS.md, 15 patterns, table contracts, Checkpoints/Audit) and RinDig/icm-architect (10 invariants, six forms, restructure mode, reference-integrity gate), both MIT, fetched 2026-10-19. source/ already holds paper v2.
