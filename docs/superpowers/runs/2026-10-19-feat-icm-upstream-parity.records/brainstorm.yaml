  - {id: icm-umbrella-form, capability: Workspace forms, acceptance: "An umbrella workspace validates each child pipeline as a full workspace and flags a child that references a sibling.", origin: ["icm-fr:docs/superpowers/specs/2026-10-19-icm-upstream-parity-design.md#R14"], status: not-implemented, verify: none}
