  - {id: icm-guardrails, capability: Validator, acceptance: "Oversized routing, reference and entry files, em dashes, duplicated facts across reference files and empty folders without .gitkeep are warned.", origin: ["icm-fr:docs/superpowers/specs/2026-10-19-icm-upstream-parity-design.md#R19", "icm-fr:docs/superpowers/specs/2026-10-19-icm-upstream-parity-design.md#R20"], status: not-implemented, verify: none}
