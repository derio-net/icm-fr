  - {kind: decision, id: d-modes, title: "Add restructure mode, setup/status triggers, audit-first scaffold", body: "All three selected."}
  - {kind: decision, id: d-verify, title: Fixtures plus a new CI workflow, body: "No install program, so rows use strategy none, proved by test_validate.py in GitHub Actions."}
  - {kind: decision, id: d-naming, title: Switch stage naming to NN-slug, body: "Underscore stage folders become a validator error; in-repo workspaces migrate."}
  - {kind: decision, id: d-skills, title: Adopt bundled skills/ as neutral Layer 3, body: "Referenced like any reference file."}
  - {kind: decision, id: d-guardrails, title: Size limits and em-dash rule as warnings, body: "All upstream guardrails, warning level."}
  - {kind: decision, id: d-no-copy, title: Ideas only from course material, body: "Course material is free but nothing is copied; all prose original; cite paper/upstream where a rule originates there."}
